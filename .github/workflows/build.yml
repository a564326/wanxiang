name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev zlib1g-dev \
            libbz2-dev libsqlite3-dev liblzma-dev

      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install buildozer / p4a
        run: |
          pip install --upgrade pip
          pip install buildozer python-for-android

      - name: Diagnose Android SDK
        run: |
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo "=== ANDROID_SDK_ROOT ==="
          echo $ANDROID_SDK_ROOT
          echo "=== /usr/local/lib/android ==="
          ls -la /usr/local/lib/android/ 2>/dev/null || echo "not found"
          echo "=== /usr/local/lib/android/sdk ==="
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "not found"
          echo "=== find sdkmanager ==="
          find /usr/local/lib/android -name "sdkmanager" 2>/dev/null || echo "not found"
          echo "=== which sdkmanager ==="
          which sdkmanager || echo "not in PATH"

      - name: Setup Android SDK and accept licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          # Find sdkmanager
          SDKMANAGER=$(find /usr/local/lib/android -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "sdkmanager found at: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            export PATH=$PATH:$(dirname $SDKMANAGER)
            yes | $SDKMANAGER --licenses || true
            yes | $SDKMANAGER --install "build-tools;34.0.0" "platforms;android-34" || true
            echo "=== installed build-tools ==="
            ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"
            echo "=== aidl location ==="
            find $ANDROID_HOME -name "aidl" 2>/dev/null || echo "aidl not found"
          else
            echo "sdkmanager not found, will rely on buildozer auto-install"
          fi

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find /usr/local/lib/android -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            export PATH=$PATH:$(dirname $SDKMANAGER):$ANDROID_HOME/platform-tools
          fi
          buildozer android debug 2>&1 | tail -100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanxiang-apk
          path: bin/*.apk
