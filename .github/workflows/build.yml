name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev zlib1g-dev \
            libbz2-dev libsqlite3-dev liblzma-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libmtdev-dev libpcre3-dev libglew-dev

      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install buildozer / p4a
        run: |
          pip install --upgrade pip
          pip install buildozer python-for-android

      - name: Install p4a mirror bootstrap (.pth auto-injection)
        run: |
          SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "site-packages: $SITE_PACKAGES"
          cp .github/p4a_mirror_bootstrap.py $SITE_PACKAGES/
          cp .github/p4a_mirror.pth $SITE_PACKAGES/
          echo "=== installed ==="
          ls -la $SITE_PACKAGES/p4a_mirror*
          echo "=== test import ==="
          python3 -c "import p4a_mirror_bootstrap; print('p4a_mirror_bootstrap loaded OK')"
          echo "=== verify patch works after p4a import ==="
          python3 -c "
          import pythonforandroid
          import os
          recipes_dir = os.path.join(os.path.dirname(pythonforandroid.__file__), 'recipes')
          freetype_url = ''
          for root, dirs, files in os.walk(os.path.join(recipes_dir, 'freetype')):
              for f in files:
                  if f.endswith('.py'):
                      content = open(os.path.join(root, f)).read()
                      if 'mirrors.ustc.edu.cn' in content:
                          print('freetype recipe patched with USTC mirror!')
                          break
          "

      - name: Setup Android SDK and accept ALL licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find /usr/local/lib/android -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            export PATH=$PATH:$(dirname $SDKMANAGER)
            # Accept all licenses (multiple times in case new ones appear)
            yes | $SDKMANAGER --licenses || true
            yes | $SDKMANAGER --licenses || true
            # Install multiple build-tools versions to be safe
            yes | $SDKMANAGER --install "build-tools;34.0.0" "platforms;android-34" || true
            yes | $SDKMANAGER --install "build-tools;37.0.0" "platforms;android-37" || true
            yes | $SDKMANAGER --install "build-tools;35.0.0" "platforms;android-35" || true
            # Verify
            echo "=== build-tools versions ==="
            ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"
            echo "=== aidl locations ==="
            find $ANDROID_HOME -name "aidl" 2>/dev/null || echo "aidl not found"
            echo "=== licenses ==="
            ls -la $ANDROID_HOME/licenses/ 2>/dev/null || echo "no licenses dir"
          fi

      - name: Create license files directly (no interactive accept)
        run: |
          SDK_DIR=/usr/local/lib/android/sdk
          mkdir -p $SDK_DIR/licenses
          # Android SDK License - all known hashes
          cat > $SDK_DIR/licenses/android-sdk-license << 'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c5
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          # Android SDK Preview License
          cat > $SDK_DIR/licenses/android-sdk-preview-license << 'EOF'
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          # Google GDK License
          cat > $SDK_DIR/licenses/google-gdk-license << 'EOF'
          33b6a2271e9633827b50e9e2f493b2e16e1e0e9
          EOF
          echo "=== licenses created ==="
          ls -la $SDK_DIR/licenses/
          # Also create in buildozer's possible SDK location
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp $SDK_DIR/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          echo "=== also copied to buildozer SDK path ==="

      - name: Link system SDK to buildozer's expected path
        run: |
          # Create buildozer platform directory
          mkdir -p ~/.buildozer/android/platform
          # Remove existing empty/wrong SDK dir if present
          rm -rf ~/.buildozer/android/platform/android-sdk 2>/dev/null || true
          # Symlink system SDK (which has sdkmanager, build-tools, licenses)
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          echo "=== symlink created ==="
          ls -la ~/.buildozer/android/platform/
          echo "=== verify sdkmanager in linked path ==="
          find ~/.buildozer/android/platform/android-sdk -name "sdkmanager" 2>/dev/null || echo "sdkmanager not found in linked path"
          echo "=== verify build-tools ==="
          ls ~/.buildozer/android/platform/android-sdk/build-tools/ 2>/dev/null || echo "no build-tools"

      - name: Create sdkmanager wrapper at old path (tools/bin)
        run: |
          SDK_DIR=/usr/local/lib/android/sdk
          # Find actual sdkmanager
          REAL_SDKMANAGER=$(find $SDK_DIR -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "real sdkmanager: $REAL_SDKMANAGER"
          # Create old-style path that buildozer expects
          mkdir -p $SDK_DIR/tools/bin
          cat > $SDK_DIR/tools/bin/sdkmanager << EOF
          #!/bin/bash
          exec $REAL_SDKMANAGER "\$@"
          EOF
          chmod +x $SDK_DIR/tools/bin/sdkmanager
          echo "=== wrapper created ==="
          ls -la $SDK_DIR/tools/bin/
          echo "=== test wrapper ==="
          $SDK_DIR/tools/bin/sdkmanager --version 2>&1 | head -3 || echo "wrapper test failed"
          # Note: buildozer path is symlinked to system SDK, so no need to copy
          echo "=== buildozer SDK path is symlinked to system SDK ==="
          ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/ 2>/dev/null || echo "checking symlink..."

      - name: Fetch prebuilt recipes (offline tarballs)
        run: |
          python3 fetch_recipes.py
          echo "=== prebuilt contents ==="
          ls -la prebuilt/ 2>/dev/null || echo "no prebuilt dir"

      - name: Patch p4a recipes to use local tarballs (bypass network entirely)
        run: |
          P4A_DIR=$(python3 -c "import pythonforandroid; print(pythonforandroid.__path__[0])")
          echo "p4a dir: $P4A_DIR"
          # Patch freetype recipe to use local file
          FREETYPE_RECIPE=$(find $P4A_DIR/recipes/freetype -name "*.py" | head -1)
          if [ -n "$FREETYPE_RECIPE" ] && [ -f "prebuilt/freetype-2.14.1.tar.gz" ]; then
            LOCAL_PATH=$(realpath prebuilt/freetype-2.14.1.tar.gz)
            echo "Patching $FREETYPE_RECIPE to use $LOCAL_PATH"
            # Replace any http URL with local file path
            sed -i "s|https\?://[^'\"]*freetype[^'\"]*\.tar\.gz|file://$LOCAL_PATH|g" "$FREETYPE_RECIPE"
            echo "=== patched freetype recipe ==="
            grep -i "url\|file://" "$FREETYPE_RECIPE" | head -5
          else
            echo "WARNING: freetype recipe or tarball not found"
          fi
          # Also patch any other recipes that might have GNU/savannah URLs
          find $P4A_DIR/recipes -name "*.py" -exec sed -i 's|download.savannah.gnu.org|mirrors.ustc.edu.cn|g' {} \;
          find $P4A_DIR/recipes -name "*.py" -exec sed -i 's|ftp.gnu.org/gnu|mirrors.ustc.edu.cn/gnu|g' {} \;
          echo "=== all recipes patched ==="

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
          JAVA_OPTS: "-Xmx4096m"
        run: |
          SDKMANAGER=$(find /usr/local/lib/android -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            export PATH=$PATH:$(dirname $SDKMANAGER):$ANDROID_HOME/platform-tools
          fi
          buildozer android debug

      - name: Check build output
        if: always()
        run: |
          echo "=== bin directory ==="
          ls -la bin/ 2>/dev/null || echo "no bin dir"
          echo "=== find apk ==="
          find . -name "*.apk" 2>/dev/null || echo "no apk found"
          echo "=== buildozer log ==="
          cat .buildozer/android/platform/build-*/build.log 2>/dev/null | tail -50 || echo "no build log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanxiang-apk
          path: bin/*.apk
